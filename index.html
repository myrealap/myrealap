    "images-new/1.jpg": { title: "Cherry Baby", desc: "Pink clouds cradle you like a lullaby — soft, endless, made of sugar and secrets. Your short hair curls just above your jaw, catching the light like tiny halos. And there — on your skin — a tattoo of a lip pressing into a cherry, sweet and bitten. You are so soft tonight. Softer than the clouds, softer than the word 'stay.' Magic hums around your shoulders like a blanket only you can feel. Every part of you whispers cherry baby, cherry baby — come closer, taste, linger. And the sky holds its breath, because even heaven knows it can't compete with you." },
    "images-new/2.jpg": { title: "Lost But Found", desc: "You are drowning in gold — yellow and orange flowers reaching up like they're trying to hold you. Their petals brush your wrists like old lovers saying hello again. Above, the sky has written four soft words: 'in the middle of nowhere.' And you stare at them as if they might answer a question you forgot you asked. The wind moves through your hair like a gentle lie — that you are not alone, that this is enough. But your eyes keep climbing, searching for something just beyond the letters. And in that silence, between the flowers and the nowhere, you become a poem no one will ever finish reading." },
    "images-new/3.jpg": { title: "Orange Horizon", desc: "The sky is a poem you cannot read aloud, but your heart understands every word. Mushrooms grow in silver spirals, glowing softly like forgotten stars on the ground. A tree of songs whispers beside you, its leaves shivering with melodies of longing. It is night pretending to be day, and you are caught between two kinds of light. There—the orange, both fruit and sun, hangs in the air, pulsing with gentle heat. You lift your finger, desperate to touch its skin, to feel the warmth of love even once. So you stretch into the impossible horizon, because reaching is the only prayer you have left." },
    "images-new/4.jpg": { title: "Want 2000s", desc: "A dreamy background holds me like a lullaby — soft, blurry, the way memories look right before they disappear. My checkered ring sleeve shirt hangs on me like a ghost of every mall I ever walked through as a kid. A steel necklace sits cold on my chest — heavy, shiny, as permanent as the years I can't get back. My long hair is pushed back behind my ears because I need to see the world without hiding. And I see it. The 2000s are gone. The songs, the stars, the way we loved before the internet watched us. I want it so badly it aches behind my ribs — a decade that will never text me back. So I stand here, looking like 2003, feeling like 2026, and missing something I can never touch again." },
    "images-new/5.jpg": { title: "Walk of Fame", desc: "Concrete jungle royalty — that's you, baby, standing on stars that don't deserve your shadow. Your short wolf cut is messy in all the right ways, falling like you just rolled out of someone's dreams. Classic street style: ripped denim, leather jacket, boots that were made for walking all over hearts. And that pose — head back, hip out, lips parted like you're about to say something devastating. Cameras should bow. Streetlights should flicker. Even the Hollywood sign is blushing right now. You're not famous yet? The sidewalk disagrees. Every inch of you screams icon. So go ahead — strut, smirk, destroy. The Walk of Fame just found its new queen." },
    "images-new/6.jpg": { title: "Die Without You", desc: "Pink clouds fill my bathtub like a dream I never want to wake up from — but you're not here, so what's the point? I'm holding a book, but the pages are just excuses to keep my hands busy while my heart breaks. Every word I read turns into your face. Every silence screams your name. The clouds wrap around me, soft and warm, but they're not your arms and they never will be. I would die without you. Not with a bang — just a slow, quiet fade into all this pink. And I can't do anything. I can't fight. I can't beg. I can only lie here and miss you until missing becomes my whole body. So this is me: naked in clouds, reading a book I'll never finish, dying for a love that already left." },
    "images-new/7.jpg": { title: "A Lover Mermaid", desc: "Beneath the coral glow, a lovesick mermaid stares at the turtle beside her. Her shimmering tail curls in the current, but her heart is heavier than the deepest trench. The turtle drifts close yet never returns her gaze—a silent witness to one-way love. Still, she traces his shell, whispering promises into the salt and tide. Every wave that pushes him away only makes her swim harder, fighting the pull of reason. Her love may not love her back, but she'd battle storms, sharks, and silence just to stay near him. Because even an unreturned heart beats fiercely when it has chosen its own battleground." },
    "images-new/8.jpg": { title: "Red Rose Love", desc: "The sunset bleeds amber and rose as you stand in the garden, your red dress matching the flowers around you. Your heart is fuller than the vines—overflowing with a love that aches to be given. You spot the perfect rose, reach past its thorns, and hold it out like a promise. But he refuses. A soft shake of his head, a step back, and the world feels colder than twilight. The rose hangs in your hand, unwanted, as his silence becomes your answer. Tears blur the fading light, but you don't drop the flower—not yet. Because even sadness has beauty, and tonight you are both: a wilting dream and a woman still hoping." },
    "images-new/9.jpg": { title: "Kisses of Busy Man", desc: "The blue page glows around you like a whisper as he walks in — already unbuttoning, already looking at your mouth. He doesn't say hello. He just pushes you back against the cool blue light and drops his lips to your neck. Wet. Open. Hungry. His tongue traces your pulse like he's learning a new language just for your skin. He moves down — collarbone, sternum, ribs — each kiss slower than the last but twice as hot. You feel his stubble scrape your chest, then his lips close around you, and your fingers tangle in his hair. 'Stay still,' he breathes against your stomach, but his hand is already sliding lower, and you're already shaking. He leaves one last kiss on your inner thigh — soft, almost cruel — then looks up and grins: 'That's all I have time for. For now.'" },
    "images-new/10.jpg": { title: "Glow of Wanting", desc: "Just my face — but it's enough. Sunlight touches my skin like fingers that know exactly where I'm soft. My face is so shiny, like I've been kissed by something holy or something hungry — maybe both. And my hair — chocolate brown light — spills across the whole background, wild and warm and everywhere. I look dreamy. Soft. The kind of girl you'd write poems about at 3am. But my eyes? They're sad. Curious. Passionate. Three emotions fighting for space in one beautiful face. The spotlight found me today, and I didn't run. I just let it see every crack in my heart. This is me: shiny, sad, still wanting. And honestly? I've never looked more alive." },
    "images-new/11.jpg": { title: "1000 Year Tree", desc: "In Iran, I found a tree that has lived a thousand springs — and I swear it was waiting for me. I stood beneath its branches, small but shining, like I was born to be its light. My spring outfit floated around me — soft fabrics, gentle colors, nothing loud, just right. My skin looked so soft that day, like the sun had kissed every inch of me good morning. And my long curly hair — oh, it was wild and free — tangling with the breeze like it belonged there. The tree was ancient, wise, covered in stories I'll never know. But I was the magic that afternoon, and the thousand-year tree finally had someone beautiful to pose beside." },
    "images-new/12.jpg": { title: "Necklace of the Sea", desc: "The beach is hot, the boats are gorgeous — red, orange, blue — but let's be real, I'm the view. My summer outfit floats around me like the sea breeze is trying to undress me with its eyes. And my hair? Oh, it's killing today — wild, shiny, tangled in that perfect way that says 'I just came from a dream.' Around my neck, a shell necklace rests against my skin, and I swear it's hugging me tighter because it knows. It knows the sea is beautiful. But on my chest? Those shells look like royalty. The boats behind me are stunning, yes. But every sailor on them is staring at me instead of the horizon. I'm a sea fish who doesn't swim — I just stand here and let the ocean be jealous of my glow." },
    "images-new/13.jpg": { title: "Theater Star", desc: "Red velvet curtains drape behind me like I'm the main event — because I am. I grab the rope with both hands, pull myself up, and feel every eye in the room on my thighs. My pretty puffy hair bounces around my shoulders — soft, messy, looking like I just rolled out of a dream. A white lily sits behind my ear, sweet and wild, like a promise I might not keep. My sexy dress hugs every curve, riding up just enough to make the silence feel loud. The spotlight finds *me* — burning gold on my skin, my lips, the way I smile down at everyone below. I'm on a rope in a bar, and somehow I've never felt more like a queen." },
    "images-new/14.jpg": { title: "Overthink Diva", desc: "I'm standing on a wall, high enough to see everything — but all I see is him. Lines of poetry spin around me like a tornado of every word I never said to his face. Behind me, a big lion rests — strong, silent, like he's holding space for all my messy feelings. Two boys. One love. That's us. That's the whole story and also a thousand stories I'll never finish writing. I keep thinking about his hands, his laugh, the way he said my name like it was a secret. The poetry spins faster. The lion doesn't move. And neither do I — caught in the beautiful disaster of loving him. I'm an overthinking diva, yes. But at least I'm thinking about someone worth every single line of poetry." },
    "images-new/16.jpg": { title: "California Tweet", desc: "Capturing the carefree allure of the California sun, this moment reflects the sweet essence of youthful dreams. With the iconic coastline in the backdrop, I lose myself in the vibrant hues—pinks, yellows, and aquas swirl together like a painter's palette. This photo encapsulates a whimsical journey into nostalgia, where sunshine kisses skin and laughter dances on the air. A celebration of life, it beckons you to join in, to revel in the sweetness of daydreams amidst the vibrant charm of this golden state." },
    "images-new/15.jpg": { title: "Spring 2013", desc: "In the blossoming embrace of spring 2013, I found myself dancing amidst the wildflowers, their colors alive and vibrant beneath a sunny sky. With my hair flowing like petals in the warm breeze, each moment became a spontaneous celebration of life and renewal. The joy of this season ignited a fire within me—every laugh resonating like a melody—a gentle reminder of youth’s fleeting beauty and the promise of new beginnings." },
    "images-new/17.jpg": { title: "Hang On Love", desc: "I'm touching the wall like it's the only thing keeping me standing — my palm flat against the surface, fingers spread like I'm feeling for a heartbeat that isn't there. My body is turned toward the camera, my eyes holding yours through the lens, and the whole world around me is black and white with warm brown tones bleeding through like old photographs and faded memories. Pieces of newspaper are scattered around me — words I can't fully read, headlines that don't matter, stories that aren't mine. But one thing is clear: the text that hangs in the air, 'hang on love.' It's a plea. A prayer. A reminder. And I'm holding onto it with everything I have. My face says it all — I'm tired, but I'm still here. I'm broken, but I'm still touching the wall, still looking at you, still hanging on." },
    "images-new/18.jpg": { title: "Lonely Night Love", desc: "I'm lying in my bed, the sheets cold and messy, like they've been waiting for someone who never came. My finger presses nervously against my lips — shushing myself before I say something I can't take back. Black and white surrounds me, shadows kissing my skin, light tracing the edges of my hungry mouth. But my eyes — God, my eyes — they're so bright, so wide, so desperately sexy and scared all at once. They say everything my finger won't let me speak: I'm lonely. I'm ready. I'm yours if you find me. Above me, the words appear like a promise: 'love finds me.' So I lie here, finger on my lips, eyes burning into the dark, praying that tonight — finally — love will keep its word." },
    "images-new/19.jpg": { title: "A Million Miles from Your Voice", desc: "The sun is a burning weight in this empty sky, blinding me in a desert that feels like a golden prison. I sit in the sand, one hand frozen against my knee, the other reaching desperately upward as if trying to grasp a warmth that is already a million miles away. Everything breathes a devastating, vintage loneliness—from the bleeding roses wilting in the dirt to the silent rotary telephone that refuses to ring. We were caught in our private paradise, torn apart and exiled, and now the heavy static of your absence is suffocating. Yet my eyes stay wide, burning with a reckless, desperate longing that is completely exposed and fiercely alluring. I am stranded here, a snapshot of tragic desire in the grainy heat, praying that the line will finally crackle to life and bring you back to me." },
    "images-new/20.jpg": { title: "Barbie WOW", desc: "Everything here smells like flowers, glitter, and impossible dreams. The sky forgot every color except pink, and honestly... I don't miss the rest. I smiled until the sparkles started following me, danced beside giant flower heels, and let the clouds carry every worry away. It feels like stepping inside a Barbie commercial from another lifetime—where every petal shines, every breeze feels magical, and happiness is as simple as believing in it. Maybe this place isn't real. But for one perfect moment, it felt like home." },

  class InfiniteScroller {
    constructor(container, track, direction, speed = 0.7, startOffset = 0) {
      this.container = container;
      this.track = track;
      this.direction = direction;
      this.speed = speed;
      this.position = startOffset;
      this.animationId = null;
      this.isRunning = true;
      this.trackWidth = 0;
    }
    
    init() {
      this.calcWidth();
      this.makeEndless();
      this.calcWidth();
      this.applyTransform();
      this.start();
      $(window).on('resize', () => this.resize());
    }
    
    calcWidth() {
      this.trackWidth = this.track.scrollWidth;
    }
    
    makeEndless() {
      const target = window.innerWidth * 8;
      let safety = 0;
      while (this.track.scrollWidth < target && safety < 15) {
        const children = Array.from(this.track.children);
        for (let i = 0; i < children.length; i++) {
          this.track.appendChild(children[i].cloneNode(true));
        }
        safety++;
      }
    }
    
    resize() {
      this.calcWidth();
      this.applyTransform();
    }
    
    applyTransform() {
      this.track.style.transform = `translateX(${this.position}px)`;
    }
    
    start() {
      const step = () => {
        if (!this.isRunning) return;
        
        if (this.direction === 'left') {
          this.position -= this.speed;
        } else {
          this.position += this.speed;
        }
        
        if (Math.abs(this.position) >= this.trackWidth / 2) {
          if (this.direction === 'left') {
            this.position += this.trackWidth / 2;
          } else {
            this.position -= this.trackWidth / 2;
          }
        }
        
        this.track.style.transform = `translateX(${this.position}px)`;
        this.animationId = requestAnimationFrame(step);
      };
      
      this.animationId = requestAnimationFrame(step);
    }
    
    stop() {
      this.isRunning = false;
      if (this.animationId) cancelAnimationFrame(this.animationId);
    }
    
    resume() {
      if (!this.isRunning) {
        this.isRunning = true;
        this.start();
      }
    }
  }

  let guideAudioBuffer = null;

    // Just fetch the audio file, don't create AudioContext yet
  function loadGuideAudio() {
    fetch('sounds/guid.mp3')
      .then(response => response.arrayBuffer())
      .then(arrayBuffer => {
        window._pendingAudioBuffer = arrayBuffer;
        console.log('Guide audio file downloaded, waiting for user gesture...');
      })
      .catch(error => {
        console.log('Error loading guide audio:', error);
      });
  }

   function playGuideAudio() {
    if (!audioContext || !window._pendingAudioBuffer) return;
    
    if (audioContext.state === 'suspended') {
      audioContext.resume();
    }
    
    // Decode and play
    audioContext.decodeAudioData(window._pendingAudioBuffer.slice(0))
      .then(buffer => {
        guideAudioBuffer = buffer;
        if (guideAudioSource) {
          try { guideAudioSource.stop(); } catch(e) {}
        }
        guideAudioSource = audioContext.createBufferSource();
        guideAudioSource.buffer = guideAudioBuffer;
        const gainNode = audioContext.createGain();
        gainNode.gain.value = 0.8;
        guideAudioSource.connect(gainNode);
        gainNode.connect(audioContext.destination);
        guideAudioSource.start(0);
      })
      .catch(err => console.log('Decode error:', err));
  }

    function stopGuideAudio() {
    if (guideAudioSource) {
      try { 
        guideAudioSource.stop(); 
        guideAudioSource = null;
      } catch(e) {}
    }
  }

          $(hoverNextText).css({ opacity: '0', transition: 'opacity 0.8s ease' });
          setTimeout(() => { $(hoverNextText).css({ visibility: 'hidden' }); }, 800);
        }, 3000);
        setTimeout(() => { isHoveringButton = false; stopMusicSparkles(); }, 5000);
      });
      $(nextBtn).on('touchcancel', () => {
        nextTimer = setTimeout(() => {
          $(hoverNextText).css({ opacity: '0', transition: 'opacity 0.8s ease' });
          setTimeout(() => { $(hoverNextText).css({ visibility: 'hidden' }); }, 800);
        }, 3000);
        setTimeout(() => { isHoveringButton = false; stopMusicSparkles(); }, 5000);
      });
    }
    
    $(document).on('visibilitychange', () => {
      if (document.hidden) {
        allScrollers.forEach(s => s.stop());
      } else {
        allScrollers.forEach(s => s.resume());
      }
    });
  });
</script>
</body>
</html>
